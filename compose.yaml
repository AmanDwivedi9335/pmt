name: fieldwork
services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: pmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmt_local_only}
      POSTGRES_DB: pmt
    ports: ["127.0.0.1:5435:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pmt -d pmt"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-local-development}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [object_data:/data]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pmt:${POSTGRES_PASSWORD:-pmt_local_only}@postgres:5432/pmt
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:4000:4000"]
  worker:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.api }
    command: [node, dist/jobs.js]
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pmt:${POSTGRES_PASSWORD:-pmt_local_only}@postgres:5432/pmt
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    depends_on:
      postgres: { condition: service_healthy }
  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  object_data:
