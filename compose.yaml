name: fieldwork
services:
  mongodb:
    image: mongo:8.0
    command: [mongod, --replSet, pmt, --bind_ip_all]
    ports: ["127.0.0.1:27018:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test:
        - CMD
        - mongosh
        - mongodb://127.0.0.1:27017/admin?directConnection=true
        - --quiet
        - --eval
        - >-
          try {
            const status = rs.status();
            quit(status.members.some(member => member.self && member.state === 1) ? 0 : 1);
          } catch (e) {
            if (e.code === 94)
              rs.initiate({_id: "pmt", members: [{_id: 0, host: "mongodb:27017"}]});
            quit(1);
          }
      interval: 3s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-local-development}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [object_data:/data]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: mongodb://mongodb:27017/pmt?replicaSet=pmt
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    depends_on:
      mongodb: { condition: service_healthy }
    ports: ["127.0.0.1:4000:4000"]
  worker:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.api }
    command: [node, dist/jobs.js]
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: mongodb://mongodb:27017/pmt?replicaSet=pmt
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    depends_on:
      mongodb: { condition: service_healthy }
  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  mongo_data:
  object_data:
