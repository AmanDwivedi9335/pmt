name: Required checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          {
            POSTGRES_USER: pmt,
            POSTGRES_PASSWORD: ci_password,
            POSTGRES_DB: pmt_test,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pmt:ci_password@localhost:5432/pmt_test
      TEST_DATABASE_URL: postgresql://pmt:ci_password@localhost:5432/pmt_test
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm --filter @pmt/shared build
      - run: pnpm db:migrate
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps msedge
      - name: Run browser acceptance tests
        run: |
          export IDENTITY_MAIL_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$IDENTITY_MAIL_KEY"
          pnpm --filter @pmt/api exec node dist/main.js > api.log 2>&1 &
          pnpm --filter @pmt/web start > web.log 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            http://localhost:3000/api/v1/ready >/dev/null
          pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure() && hashFiles('test-results/**', 'playwright-report/**', '*.log') != ''
        with:
          name: failure-diagnostics
          path: |
            test-results/
            playwright-report/
            *.log

