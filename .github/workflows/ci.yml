name: Required checks
on: [push, pull_request]
jobs:
  verify:
    # MongoDB 8.0 can exit at startup on the Ubuntu 24.04 runner kernel.
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: mongodb://127.0.0.1:27018/pmt_test?replicaSet=pmt&directConnection=true
      TEST_DATABASE_URL: mongodb://127.0.0.1:27018/pmt_test?replicaSet=pmt&directConnection=true
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm --filter @pmt/shared build
      - name: Start MongoDB replica set
        id: mongodb
        run: docker compose up -d --wait --wait-timeout 90 mongodb
      - name: Collect MongoDB startup diagnostics
        if: failure() && steps.mongodb.outcome == 'failure'
        run: |
          uname -r
          docker compose ps --all mongodb
          docker compose logs --no-color mongodb | tee mongodb.log
      - run: pnpm db:push
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps msedge
      - name: Run browser acceptance tests
        run: |
          export IDENTITY_MAIL_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$IDENTITY_MAIL_KEY"
          pnpm --filter @pmt/api exec node dist/main.js > api.log 2>&1 &
          pnpm --filter @pmt/web start > web.log 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            http://localhost:3000/api/v1/ready >/dev/null
          pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure() && hashFiles('test-results/**', 'playwright-report/**', '*.log') != ''
        with:
          name: failure-diagnostics
          path: |
            test-results/
            playwright-report/
            *.log
